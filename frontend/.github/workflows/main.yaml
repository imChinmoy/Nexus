name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Test and Build Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Load GitHub secrets into env
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            printf '%s' "${{ secrets.ENV_FILE }}" > .env
            echo ".env created from ENV_FILE secret."
          fi

          if [ -n "${{ secrets.APP_ENV }}" ]; then
            echo "APP_ENV=${{ secrets.APP_ENV }}" >> .env
          fi

          if [ -n "${{ secrets.API_BASE_URL }}" ]; then
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          fi

          echo "Secrets loaded if configured."

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Web release
        run: flutter build web --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-web-build
          path: build/web
