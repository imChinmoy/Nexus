name: brl_nexus
description: BRL Nexus - Blockchain Research Lab Society Management Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.2.7

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Network
  dio: ^5.7.0

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  responsive_framework: ^1.4.0

  # QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  csv: ^6.0.0


  # Animations
  animate_do: ^3.3.4
  lottie: ^3.1.2
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
